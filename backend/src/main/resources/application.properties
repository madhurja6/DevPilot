spring.application.name=backend

# Defaults match docker-compose.yml (MySQL on host port 3307)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/devpilot}
spring.datasource.username=${DB_USERNAME:mysql}
spring.datasource.password=${DB_PASSWORD:mysqlpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

